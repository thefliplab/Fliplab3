<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipLab 3.0 Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --nav:#1f2933; --mint:#3ecf9e; --mint-soft:#e6f8f1; --bg:#f3f5f7; --text:#1f2933; --muted:#6b7680; --line:#e2e6ea; --danger:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  nav { background:var(--nav); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  nav b { font-size:17px; } nav b span { color:var(--mint); }
  nav button { background:transparent; color:#cfd6dc; border:1px solid #3a4651; border-radius:6px; padding:6px 10px; font-size:13px; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:16px; margin-bottom:12px; }
  .hdr { background:var(--mint); color:#fff; font-weight:600; padding:8px 12px; border-radius:8px; margin:16px 0 8px; display:flex; justify-content:space-between; }
  input, select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:16px; margin:4px 0 10px; background:#fff; }
  label { font-size:13px; color:var(--muted); }
  .btn { background:var(--mint); color:#fff; border:0; border-radius:8px; padding:11px 16px; font-size:15px; font-weight:600; width:100%; }
  .btn.ghost { background:#fff; color:var(--text); border:1px solid var(--line); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stu { display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .stu:last-child { border-bottom:0; }
  .stu small { color:var(--muted); display:block; margin-top:2px; }
  .pill { font-size:12px; padding:3px 9px; border-radius:20px; background:var(--mint-soft); color:#1c7a5a; white-space:nowrap; }
  .pill.off { background:#eef0f2; color:var(--muted); }
  .msg { font-size:14px; margin:8px 0; } .msg.err { color:var(--danger); }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; }
  .hidden { display:none !important; }
  .toolbar { display:flex; gap:8px; } .toolbar input { margin:0; } .toolbar .btn { width:auto; white-space:nowrap; }
  .chk { display:flex; gap:8px; align-items:center; margin-bottom:10px; } .chk input { width:auto; margin:0; }
  .center { text-align:center; color:var(--muted); padding:20px; }
  #tabs { display:flex; gap:4px; } #tabs button { border:0; color:#cfd6dc; } #tabs button.on { background:#3a4651; color:#fff; }
  .wk { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .wk button { background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  .wk input, .wk select { width:auto; flex:1; min-width:120px; margin:0; padding:7px 10px; font-size:14px; }
  .wklabel { font-size:13px; color:var(--muted); font-weight:600; min-width:120px; text-align:center; }
  .dayhd { background:#9FE1CB; color:#2c2c2a; padding:6px 12px; font-weight:600; font-size:13px; margin-top:6px; border-radius:6px 6px 0 0; }
  .dayhd.today { background:#1c9a73; color:#fff; } .dayhd span { font-weight:400; opacity:.85; font-size:11px; margin-left:6px; }
  .srow { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid #f0f0f0; font-size:14px; background:#fff; }
  .srow .tm { min-width:72px; color:#666; font-weight:500; }
  .srow .nm { flex:1; display:flex; align-items:center; flex-wrap:wrap; gap:4px; min-width:0; }
  .srow .co { font-size:11px; color:#888; flex-shrink:0; }
  .tag { font-size:10px; padding:2px 7px; border-radius:10px; font-weight:600; }
  .t-shared { background:#EFE7FF; color:#3C3489; } .t-nophoto { background:#FCEBEB; color:#A32D2D; } .t-photo { background:#EAF3DE; color:#3B6D11; }
  .t-away { background:#FEF3C7; color:#92400E; } .t-open { background:#EAF3DE; color:#3B6D11; } .t-summer { background:#FEF3C7; color:#92400E; } .t-ex { background:#E6F1FB; color:#185FA5; }
  .srow.open { background:#fafafa; } .srow.open .tm { color:#999; } .srow.summer { background:#FFFBEB; border-left:3px solid #F59E0B; }
  .srow.away .tm { color:#B45309; } .pairwrap { display:flex; align-items:stretch; background:#FAF7FF; border-bottom:1px solid #f0f0f0; }
  .pairwrap .bar { width:3px; background:#7C3AED; margin:8px 8px; border-radius:2px; } .pairwrap .srow { background:transparent; border-bottom:1px dashed #d8cfee; padding-left:4px; }
  .pairwrap .srow:last-child { border-bottom:0; }
  .srow.tap { cursor:pointer; } .srow.tap:hover { background:#f6fbf9; }
  .ovl { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; z-index:20; overflow:auto; padding:30px 12px; }
  .mdl { background:#fff; border-radius:12px; width:100%; max-width:460px; padding:16px; }
  .mdl .mh { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .mdl .mh b { font-size:16px; }
  .mdl .x { background:#fff; border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  .mdl input[readonly] { background:#f9f8f5; }
  .pairbox { background:#EAF4FF; border:1px solid #B8D9F5; border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px; color:#185FA5; }
  .ddwrap { position:relative; } .dd { position:absolute; left:0; right:0; top:62px; background:#fff; border:1px solid var(--line); border-radius:8px; max-height:200px; overflow:auto; z-index:3; box-shadow:0 4px 12px rgba(0,0,0,.1); }
  .dd div { padding:9px 10px; font-size:14px; cursor:pointer; border-bottom:1px solid #f3f3f3; } .dd div:hover { background:var(--mint-soft); } .dd small { color:var(--muted); }
  .btnrow { display:flex; gap:8px; } .btn.red { background:var(--danger); }
</style>
</head>
<body>
<nav><b>Flip<span>Lab</span> 3.0</b>
  <div id="tabs" class="hidden"><button id="tabBtn_schedule" onclick="go('schedule')">Schedule</button><button id="tabBtn_students" onclick="go('students')">Students</button></div>
  <button id="outBtn" class="hidden" onclick="signOut()">Sign out</button></nav>
<main>

  <!-- Login -->
  <section id="loginView" class="hidden">
    <div class="card">
      <div class="tabs">
        <button class="btn" id="tabIn" onclick="setMode('in')">Sign in</button>
        <button class="btn ghost" id="tabUp" onclick="setMode('up')">Create account</button>
      </div>
      <label>Email</label><input id="email" type="email" autocomplete="email">
      <label>Password</label><input id="pw" type="password" autocomplete="current-password">
      <button class="btn" id="authBtn" onclick="doAuth()">Sign in</button>
      <div id="authMsg" class="msg"></div>
    </div>
  </section>

  <!-- No gym access yet -->
  <section id="waitView" class="hidden">
    <div class="card center">Your account is created. Waiting for it to be linked to a gym.</div>
  </section>

  <!-- Students -->
  <section id="studentsView" class="hidden">
    <div class="toolbar">
      <input id="q" placeholder="Search students or parents" oninput="render()">
      <button class="btn" onclick="openEdit(null)">+ Add</button>
    </div>
    <div class="chk" style="margin-top:10px"><input type="checkbox" id="showInactive" onchange="render()"><label for="showInactive">Show inactive &amp; dropped</label></div>
    <div class="hdr"><span id="gymName">Students</span><span id="count"></span></div>
    <div class="card" id="list"></div>
  </section>


  <!-- Schedule -->
  <section id="scheduleView" class="hidden">
    <div class="wk">
      <button onclick="shiftWeek(-1)">← Prev</button>
      <button onclick="shiftWeek(0)">This week</button>
      <button onclick="shiftWeek(1)">Next →</button>
      <div class="wklabel" id="wkLabel"></div>
      <button onclick="openAdd()" style="background:var(--mint);color:#fff;border:0;font-weight:600">+ Add lesson</button>
    </div>
    <div class="wk">
      <select id="coachFilter" onchange="renderWeek()"><option value="">All coaches</option></select>
      <input id="schedSearch" placeholder="Search student…" oninput="renderWeek()">
    </div>
    <div id="schedGrid"><div class="center">Loading…</div></div>
  </section>

  <!-- Edit student -->
  <section id="editView" class="hidden">
    <div class="hdr"><span id="editTitle">Student</span></div>
    <div class="card">
      <div class="row2">
        <div><label>First name</label><input id="f_first_name"></div>
        <div><label>Last name</label><input id="f_last_name"></div>
      </div>
      <div class="row2">
        <div><label>Birthday</label><input id="f_dob" type="date"></div>
        <div><label>Skill level</label>
          <select id="f_skill_level"><option value=""></option><option>L1</option><option>L2</option><option>L3</option><option>L4</option><option>L5</option><option>L6</option></select>
        </div>
      </div>
      <label>Parent name</label><input id="f_parent_name">
      <div class="row2">
        <div><label>Parent phone</label><input id="f_parent_phone" type="tel"></div>
        <div><label>Parent email</label><input id="f_parent_email" type="email"></div>
      </div>
      <div class="row2">
        <div><label>Emergency contact</label><input id="f_emergency_name"></div>
        <div><label>Emergency phone</label><input id="f_emergency_phone" type="tel"></div>
      </div>
      <label>Notes</label><textarea id="f_notes" rows="3"></textarea>
      <label>Status</label>
      <select id="f_status"><option>Active</option><option>Waitlist</option><option>Drop-In</option><option>Inactive</option><option>Dropped</option></select>
      <div class="chk"><input type="checkbox" id="f_unsubscribed"><label for="f_unsubscribed">Unsubscribed from emails/texts</label></div>
      <div class="row2">
        <button class="btn ghost" onclick="show('studentsView')">Cancel</button>
        <button class="btn" onclick="saveStudent()">Save</button>
      </div>
      <div id="editMsg" class="msg"></div>
    </div>
  </section>

</main>

<!-- Edit lesson modal (port of 2.0 modal-move-lesson) -->
<div class="ovl hidden" id="lessonModal" onclick="if(event.target===this)closeLesson()">
  <div class="mdl">
    <div class="mh"><b id="lm_title">Edit lesson</b><button class="x" onclick="closeLesson()">✕</button></div>
    <label>Student</label><input id="lm_student" readonly>
    <div class="row2">
      <div><label>Coach</label><select id="lm_coach"></select></div>
      <div><label>Skill level</label><input id="lm_skill" readonly></div>
    </div>
    <div class="row2">
      <div><label>Move to day</label><select id="lm_day"></select></div>
      <div><label>Move to time</label><select id="lm_time"></select></div>
    </div>
    <div class="row2">
      <div><label>Duration</label><select id="lm_duration"><option>30 min</option><option>45 min</option><option>60 min</option></select></div>
      <div><label>Lesson type</label><select id="lm_type"><option>Solo</option><option>Shared</option><option>Group</option></select></div>
    </div>
    <div id="lm_pair" class="pairbox hidden">🔗 Shared lesson with <b id="lm_partner"></b>
      <div class="chk" style="margin:6px 0 0"><input type="checkbox" id="lm_movePartner" checked><label for="lm_movePartner" style="color:#185FA5">Also apply to partner</label></div></div>
    <div id="lm_scopeWrap">
      <label>Apply change to</label>
      <select id="lm_scope" onchange="$('lm_startWrap').classList.toggle('hidden', this.value !== 'permanent')">
        <option value="week">This week only</option><option value="permanent">Permanent (from start week forward)</option></select>
      <div id="lm_startWrap" class="hidden"><label>New schedule starts the week of</label><input type="date" id="lm_start">
        <div style="font-size:11px;color:#888;margin:-6px 0 10px">Earlier weeks are left alone.</div></div>
    </div>
    <div id="lm_oneoff" class="msg hidden" style="color:#185FA5">One-week lesson (claimed spot / extra) — changes apply to this week only.</div>
    <label>Notes</label><textarea id="lm_notes" rows="2" placeholder="Lesson notes..."></textarea>
    <div class="btnrow">
      <button class="btn red" style="flex:1" onclick="cancelLesson()">Cancel lesson</button>
      <button class="btn" style="flex:2" id="lm_save" onclick="saveLesson()">Save changes</button>
    </div>
    <div id="lm_msg" class="msg"></div>
  </div>
</div>
<!-- Add lesson modal (port of 2.0 modal-add-lesson) -->
<div class="ovl hidden" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="mdl">
    <div class="mh"><b>Add lesson for student</b><button class="x" onclick="closeAdd()">✕</button></div>
    <div class="ddwrap"><label>Student</label><input id="al_student" placeholder="Search student..." autocomplete="off" oninput="alDD('student')" onfocus="alDD('student')" onblur="setTimeout(()=>$('al_studentDD').classList.add('hidden'),150)">
      <div class="dd hidden" id="al_studentDD"></div></div>
    <div class="ddwrap"><label>Partner <span style="color:#aaa">(optional — share this slot)</span></label><input id="al_partner" placeholder="Search student to share with..." autocomplete="off" oninput="alDD('partner')" onfocus="alDD('partner')" onblur="setTimeout(()=>$('al_partnerDD').classList.add('hidden'),150)">
      <div class="dd hidden" id="al_partnerDD"></div></div>
    <div id="al_price" style="font-size:11px;color:#888;margin:-6px 0 10px"></div>
    <div class="row2">
      <div><label>Coach</label><select id="al_coach"></select></div>
      <div><label>Focus</label><input id="al_focus" placeholder="e.g. Back handspring"></div>
    </div>
    <label>Duration</label><select id="al_duration" onchange="alPrice()"><option>30 min</option><option>45 min</option><option>60 min</option></select>
    <div class="row2">
      <div><label>Day</label><select id="al_day"></select></div>
      <div><label>Time</label><select id="al_time"></select></div>
    </div>
    <label>Scope</label>
    <select id="al_scope" onchange="$('al_startWrap').classList.toggle('hidden', this.value !== 'permanent')"><option value="permanent">Permanent (every week)</option><option value="week">This week only</option></select>
    <div id="al_startWrap"><label>Start date (week the lesson begins)</label><input type="date" id="al_start"></div>
    <button class="btn" id="al_save" onclick="saveAdd()">Add lesson</button>
    <div id="al_msg" class="msg"></div>
  </div>
</div>
<script>
const sb = supabase.createClient('https://angmtyojkwlrefxpcgoa.supabase.co', 'sb_publishable_fPciNfnNHpHQikB8mqHNpw_hIVRIGo5');
const FIELDS = ['first_name','last_name','dob','skill_level','parent_name','parent_phone','parent_email','emergency_name','emergency_phone','notes'];
const OFF = ['Inactive','Dropped'];
const isOn = s => !OFF.includes(s.status);
let mode = 'in', gymId = null, students = [], editingId = null;

const $ = id => document.getElementById(id);
function show(view) {
  ['loginView','waitView','studentsView','editView','scheduleView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
  $('outBtn').classList.toggle('hidden', view === 'loginView');
  $('tabs').classList.toggle('hidden', !gymId);
  ['schedule','students'].forEach(t => $('tabBtn_' + t).classList.toggle('on', view === t + 'View'));
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setMode(m) {
  mode = m;
  $('tabIn').className = 'btn' + (m === 'in' ? '' : ' ghost');
  $('tabUp').className = 'btn' + (m === 'up' ? '' : ' ghost');
  $('authBtn').textContent = m === 'in' ? 'Sign in' : 'Create account';
  $('authMsg').textContent = '';
}

async function doAuth() {
  const email = $('email').value.trim(), password = $('pw').value;
  const msg = $('authMsg'); msg.className = 'msg'; msg.textContent = 'Working…';
  const res = mode === 'in'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });
  if (res.error) { msg.className = 'msg err'; msg.textContent = res.error.message; return; }
  if (mode === 'up' && !res.data.session) { msg.textContent = 'Account created. You can sign in once it is approved.'; return; }
  boot();
}

async function signOut() { await sb.auth.signOut(); show('loginView'); }

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('loginView'); return; }
  const { data: gyms, error } = await sb.from('gyms').select('id,name').limit(1);
  if (error || !gyms || !gyms.length) { show('waitView'); return; }
  gymId = gyms[0].id; $('gymName').textContent = gyms[0].name + ' — Students';
  await loadStudents();
  go('schedule');
}
function go(tab) { if (tab === 'schedule') { show('scheduleView'); loadWeek(); } else show('studentsView'); }

async function loadStudents() {
  $('list').innerHTML = '<div class="center">Loading…</div>';
  const { data, error } = await sb.from('students').select('*').order('last_name').order('first_name');
  if (error) { $('list').innerHTML = '<div class="msg err">' + esc(error.message) + '</div>'; return; }
  students = data; render();
}

function render() {
  const q = $('q').value.trim().toLowerCase(), all = $('showInactive').checked;
  const rows = students.filter(s => (all || isOn(s)) &&
    (!q || [s.first_name, s.last_name, s.parent_name, s.parent_phone, s.parent_email].join(' ').toLowerCase().includes(q)));
  $('count').textContent = rows.length;
  $('list').innerHTML = rows.length ? rows.map(s => `
    <div class="stu" onclick="openEdit('${esc(s.id)}')">
      <div><b>${esc(s.first_name)} ${esc(s.last_name)}</b>
        <small>${esc(s.parent_name || '')}${s.parent_phone ? ' · ' + esc(s.parent_phone) : ''}</small></div>
      <span class="pill ${isOn(s) ? '' : 'off'}">${esc(s.status || 'Active')}${s.skill_level ? ' · ' + esc(s.skill_level) : ''}</span>
    </div>`).join('') : '<div class="center">No students yet.</div>';
}

function openEdit(id) {
  editingId = id;
  const s = students.find(x => x.id === id) || { status: 'Active' };
  FIELDS.forEach(f => $('f_' + f).value = s[f] ?? '');
  $('f_status').value = s.status || 'Active'; $('f_unsubscribed').checked = !!s.unsubscribed;
  $('editTitle').textContent = id ? (s.first_name + ' ' + s.last_name) : 'New student';
  $('editMsg').textContent = '';
  show('editView'); window.scrollTo(0, 0);
}

async function saveStudent() {
  const st = $('f_status').value;
  const rec = { gym_id: gymId, status: st, active: !OFF.includes(st), unsubscribed: $('f_unsubscribed').checked };
  FIELDS.forEach(f => { const v = $('f_' + f).value.trim(); rec[f] = v === '' ? null : v; });
  if (!rec.first_name) { $('editMsg').className = 'msg err'; $('editMsg').textContent = 'First name is required.'; return; }
  $('editMsg').className = 'msg'; $('editMsg').textContent = 'Saving…';
  const res = editingId
    ? await sb.from('students').update(rec).eq('id', editingId)
    : await sb.from('students').insert(rec);
  if (res.error) { $('editMsg').className = 'msg err'; $('editMsg').textContent = res.error.message; return; }
  await loadStudents(); show('studentsView');
}

// ================= SCHEDULE (port of 2.0 getPrivates + applyExceptionsToPrivates_ + renderDynScheduleList_) =================
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let weekOffset = 0, weekRows = [], weekSlots = [], weekEx = [], weekLoading = 0;

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
function weekDates() {
  const t = new Date(); t.setHours(0,0,0,0);
  const mon = new Date(t); mon.setDate(t.getDate() + (t.getDay() === 0 ? -6 : 1 - t.getDay()) + weekOffset * 7);
  return DAYS.map((name, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return { name, date: d, label: d.toLocaleDateString(undefined, { month:'short', day:'numeric' }) }; });
}
function timeVal(t) {
  const m = String(t || '').trim().match(/^(\d{1,2}):?(\d{2})?\s*([AaPp])?/); if (!m) return 9999;
  let h = +m[1] % 12; if (m[3] && /p/i.test(m[3])) h += 12; return h * 60 + (+m[2] || 0);
}
function shiftWeek(n) { weekOffset = n === 0 ? 0 : weekOffset + n; loadWeek(); }

async function loadWeek() {
  const wd = weekDates(), ws = ymd(wd[0].date), we = ymd(wd[6].date), my = ++weekLoading;
  $('wkLabel').textContent = (weekOffset === 0 ? 'This week · ' : '') + wd[0].label + ' – ' + wd[6].label;
  $('schedGrid').innerHTML = '<div class="center">Loading…</div>';
  const [L, X, S] = await Promise.all([
    sb.from('private_lessons').select('*').not('status', 'in', '("Cancelled","Dropped")'),
    sb.from('schedule_exceptions').select('*').eq('week_start', ws).not('status', 'in', '("Deleted","Expired")'),
    sb.from('available_slots').select('*').eq('active', true)
  ]);
  if (my !== weekLoading) return;
  const err = L.error || X.error || S.error;
  if (err) { $('schedGrid').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; return; }
  const base = L.data.filter(p => !(p.start_date && p.start_date > we) && !(p.end_date && p.end_date <= ws));
  weekEx = X.data;
  weekRows = applyExceptions(base, X.data);
  weekSlots = S.data;
  const coaches = [...new Set(weekRows.map(p => p.coach).concat(weekSlots.map(s => s.coach)).filter(Boolean))].sort();
  const cf = $('coachFilter'), cur = cf.value;
  cf.innerHTML = '<option value="">All coaches</option>' + coaches.map(c => `<option${c === cur ? ' selected' : ''}>${esc(c)}</option>`).join('');
  renderWeek();
}

function applyExceptions(lessons, exs) {
  const map = {}, addRows = [], attached = {}, out = [];
  exs.forEach(e => { if (e.lesson_id) map[e.lesson_id] = e; if (e.type === 'Add') addRows.push(e); });
  lessons.forEach(src => {
    const p = { ...src, exType: '', bday: src.day, btime: src.time }, ex = map[p.id];
    if (!ex) return out.push(p);
    if (ex.type === 'Cancel') return out.push({ ...p, status: 'Cancelled', exType: 'Cancel' });
    if (ex.type === 'Move') {
      out.push({ ...p, status: 'Cancelled', exType: 'MoveOrigin' });
      attached[ex.id] = true;
      return out.push({ ...p, day: ex.new_day || p.day, time: ex.new_time || p.time, coach: ex.new_coach || p.coach, exType: 'Move' });
    }
    if (ex.type === 'PriceOverride') return out.push({ ...p, lesson_type: ex.lesson_type || 'Solo', exType: 'PriceOverride' });
    if (ex.type === 'Add') {
      out.push(p); attached[ex.id] = true;
      return out.push({ ...p, id: p.id + '_EX_' + ex.id, day: ex.new_day || p.day, time: ex.new_time || p.time, coach: ex.new_coach || p.coach, exType: 'Add' });
    }
    out.push(p);
  });
  addRows.forEach(e => {
    if (attached[e.id]) return;
    out.push({ id: 'EX_ONLY_' + e.id, student_id: e.student_id, student_name: e.student_name, coach: e.new_coach || e.coach,
      day: e.new_day || '', time: e.new_time || '', bday: e.new_day || '', btime: e.new_time || '', duration: '30 min', status: 'Confirmed', lesson_type: e.lesson_type || 'Solo',
      notes: e.notes, pair_id: '', exType: 'Add' });
  });
  // Auto "Shared" when 2+ active lessons share a day+time (unless a PriceOverride kept it Solo)
  const cnt = {};
  out.forEach(p => { if (p.status !== 'Cancelled') { const k = p.day + '|' + p.time; cnt[k] = (cnt[k] || 0) + 1; } });
  out.forEach(p => { if (p.status !== 'Cancelled' && p.exType !== 'PriceOverride' && cnt[p.day + '|' + p.time] >= 2) p.lesson_type = 'Shared'; });
  return out;
}

function renderWeek() {
  const wd = weekDates(), ws = ymd(wd[0].date), md = ws.slice(5);
  const coach = $('coachFilter').value, q = $('schedSearch').value.trim().toLowerCase();
  const isSummer = md >= '05-25' && md <= '08-31';
  const todayName = weekOffset === 0 ? DAYS[(new Date().getDay() + 6) % 7] : '';
  const live = weekRows.filter(p => p.status !== 'Cancelled' && (!coach || p.coach === coach) && (!q || (p.student_name || '').toLowerCase().includes(q)));
  let slots = weekSlots.filter(s => !s.is_summer && (!coach || s.coach === coach));
  if (isSummer) {
    const have = new Set(slots.map(s => s.day + '|' + s.time));
    weekSlots.filter(s => s.is_summer && (!coach || s.coach === coach) && !have.has(s.day + '|' + s.time)).forEach(s => slots.push(s));
  }
  const photo = {}; students.forEach(s => photo[s.id] = (s.extra || {}).PhotoPermission || '');
  const pills = p => (p.lesson_type === 'Shared' && !p.pair_id ? '<span class="tag t-shared">Shared</span>' : '')
    + (photo[p.student_id] === 'No' ? '<span class="tag t-nophoto">No Photo</span>' : photo[p.student_id] === 'Yes' ? '<span class="tag t-photo">Photo OK</span>' : '')
    + (p.exType === 'Move' ? '<span class="tag t-ex">Moved</span>' : p.exType === 'Add' ? '<span class="tag t-ex">This week</span>' : '');
  const row = (p, showTime) => `<div class="srow tap" onclick="openLesson('${esc(p.id)}')"><div class="tm">${showTime ? esc(p.time) : ''}</div><div class="nm"><b>${esc(p.student_name)}</b>${pills(p)}</div><div class="co">${esc(p.coach || 'TBD')}</div></div>`;

  let html = '';
  wd.forEach(d => {
    const byTime = {};
    live.forEach(p => { if (p.day === d.name) (byTime[p.time] = byTime[p.time] || []).push(p); });
    const times = {};
    slots.filter(s => s.day === d.name).forEach(s => { if (s.time) times[s.time] = { time: s.time, coach: s.coach || '', summer: !!s.is_summer }; });
    Object.keys(byTime).forEach(t => { if (!times[t]) times[t] = { time: t, coach: '' }; });
    const list = Object.values(times).sort((a, b) => timeVal(a.time) - timeVal(b.time));
    html += `<div class="dayhd${d.name === todayName ? ' today' : ''}">${d.name}<span>${d.label}</span></div><div class="card" style="padding:0;margin-bottom:6px;border-radius:0 0 10px 10px;overflow:hidden">`;
    if (!list.length) html += '<div class="srow" style="color:#aaa;font-style:italic">No slots configured</div>';
    list.forEach(slot => {
      const ls = byTime[slot.time] || [];
      if (ls.length) {
        const groups = [], gi = {};
        ls.forEach(p => { const k = p.pair_id || ('solo:' + p.id); if (gi[k] === undefined) { gi[k] = groups.length; groups.push([]); } groups[gi[k]].push(p); });
        groups.forEach(g => {
          if (g.length > 1 && g[0].pair_id) {
            html += `<div class="pairwrap"><div class="srow" style="border:0;background:transparent;padding-right:0"><div class="tm">${esc(g[0].time)}</div></div><div class="bar"></div><div style="flex:1;min-width:0"><div style="padding:6px 0 0 4px"><span class="tag t-shared">Shared</span></div>${g.map(p => row(p, false).replace('<div class="tm"></div>', '')).join('')}</div></div>`;
          } else html += row(g[0], true);
        });
      } else {
        const away = weekRows.find(p => p.day === d.name && p.time === slot.time && p.status === 'Cancelled');
        if (away) html += `<div class="srow away tap" onclick="restoreLesson('${esc(away.id)}')"><div class="tm">${esc(slot.time)}</div><div class="nm"><span class="tag t-away">🏖 Away</span><b style="color:#92400E">${esc(away.student_name)}</b><i style="font-size:11px;color:#B45309">out this week</i></div><div class="co">${esc(away.coach || slot.coach)}</div></div>`;
        else html += `<div class="srow open tap${slot.summer ? ' summer' : ''}" onclick="openAdd('${d.name}','${esc(slot.time)}','${esc(slot.coach)}')"><div class="tm">${esc(slot.time)}</div><div class="nm"><span class="tag ${slot.summer ? 't-summer' : 't-open'}">${slot.summer ? '☀️ Summer Open' : 'Open'}</span></div><div class="co" style="color:#bbb">${esc(slot.coach)}</div></div>`;
      }
    });
    html += '</div>';
  });
  $('schedGrid').innerHTML = html;
}

// ================= EDIT LESSON (port of 2.0 openMoveLesson / saveMoveLesson / cancelFromSchedule) =================
let lmRow = null;
const TIMES = (() => { const a = []; for (let m = 8 * 60; m <= 21 * 60; m += 15) { const h = Math.floor(m / 60), mm = m % 60; a.push(((h + 11) % 12 + 1) + ':' + String(mm).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM')); } return a; })();
const opts = (arr, cur) => [...new Set([cur, ...arr].filter(Boolean))].map(v => `<option${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');
const weekStartStr = () => ymd(weekDates()[0].date);
const dateFor = day => { const d = weekDates().find(x => x.name === day); return d ? ymd(d.date) : null; };
const mondayOf = s => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
// One-week lessons: claimed spots (EX_ONLY_x) and extras attached to a lesson (lessonId_EX_x) — both are Add exceptions
const addExId = id => id.startsWith('EX_ONLY_') ? id.slice(8) : (id.includes('_EX_') ? id.split('_EX_')[1] : null);
const partnersOf = p => p.pair_id ? weekRows.filter(r => r.pair_id === p.pair_id && r.id !== p.id && r.status !== 'Cancelled' && !addExId(r.id)) : [];
function lmMsg(t, err) { $('lm_msg').className = 'msg' + (err ? ' err' : ''); $('lm_msg').textContent = t; }
function closeLesson() { $('lessonModal').classList.add('hidden'); lmRow = null; }

function openLesson(id) {
  const p = weekRows.find(r => r.id === id && r.status !== 'Cancelled'); if (!p) return;
  lmRow = p;
  const stu = students.find(s => s.id === p.student_id) || {};
  const coaches = [...new Set(weekRows.map(r => r.coach).concat(weekSlots.map(s => s.coach)).filter(Boolean))].sort();
  $('lm_title').textContent = p.student_name + ' — ' + p.day + ' ' + p.time;
  $('lm_student').value = p.student_name || '';
  $('lm_skill').value = stu.skill_level || p.focus || '';
  $('lm_coach').innerHTML = opts(coaches.concat('TBD'), p.coach || 'TBD');
  $('lm_day').innerHTML = opts(DAYS, p.day);
  $('lm_time').innerHTML = opts(TIMES, p.time);
  $('lm_duration').value = p.duration || '30 min';
  $('lm_type').value = ['Solo','Shared','Group'].includes(p.lesson_type) ? p.lesson_type : 'Solo';
  $('lm_notes').value = p.notes || '';
  const oneOff = !!addExId(p.id);
  $('lm_scopeWrap').classList.toggle('hidden', oneOff); $('lm_oneoff').classList.toggle('hidden', !oneOff);
  $('lm_scope').value = 'week'; $('lm_startWrap').classList.add('hidden'); $('lm_start').value = weekStartStr();
  const pr = oneOff ? [] : partnersOf(p);
  $('lm_pair').classList.toggle('hidden', !pr.length); $('lm_partner').textContent = pr.map(r => r.student_name).join(', ');
  $('lm_movePartner').checked = true;
  lmMsg('');
  $('lessonModal').classList.remove('hidden');
}

// Upsert one exception per lesson+week (same as 2.0 saveScheduleException)
async function saveException(p, fields) {
  const ws = weekStartStr(), cur = weekEx.find(e => e.lesson_id === p.id && e.type !== 'Add');
  const rec = { gym_id: gymId, lesson_id: p.id, student_id: p.student_id, student_name: p.student_name, coach: p.coach,
    base_day: p.bday, base_time: p.btime, week_start: ws, original_date: dateFor(p.bday), status: 'Active',
    new_day: null, new_time: null, new_coach: null, ...fields };
  return cur ? sb.from('schedule_exceptions').update(rec).eq('id', cur.id) : sb.from('schedule_exceptions').insert({ ...rec, created_at: new Date().toISOString() });
}

// Permanent: end the old lesson the Monday before start week, add a new lesson from that Monday (2.0 moveLesson permanent)
async function permanentChange(p, ch, startMonday) {
  const { data: src, error } = await sb.from('private_lessons').select('*').eq('id', p.id).single();
  if (error) return { error };
  const e1 = await sb.from('private_lessons').update({ end_date: startMonday }).eq('id', p.id);
  if (e1.error) return e1;
  const { id, created_at, ...copy } = src;
  return sb.from('private_lessons').insert({ ...copy, ...ch, status: 'Confirmed', paid: 'Unpaid', start_date: startMonday, end_date: null });
}

async function saveLesson() {
  const p = lmRow; if (!p) return;
  const ch = { day: $('lm_day').value, time: $('lm_time').value, coach: $('lm_coach').value, duration: $('lm_duration').value, lesson_type: $('lm_type').value, notes: $('lm_notes').value.trim() || null };
  const moved = ch.day !== p.day || ch.time !== p.time || ch.coach !== (p.coach || 'TBD');
  const other = ch.duration !== (p.duration || '30 min') || ch.lesson_type !== p.lesson_type;
  const exId = addExId(p.id);
  $('lm_save').disabled = true; lmMsg('Saving…');
  let res;
  if (exId) {
    res = await sb.from('schedule_exceptions').update({ new_day: ch.day, new_time: ch.time, new_coach: ch.coach, lesson_type: ch.lesson_type, notes: ch.notes }).eq('id', exId);
  } else if ($('lm_scope').value === 'permanent' && (moved || other)) {
    const start = mondayOf($('lm_start').value || weekStartStr());
    for (const r of [p, ...($('lm_movePartner').checked ? partnersOf(p) : [])]) {
      res = await permanentChange(r, r === p ? ch : { day: ch.day, time: ch.time, coach: ch.coach, duration: ch.duration, lesson_type: ch.lesson_type }, start);
      if (res.error) break;
    }
  } else {
    if (moved) for (const r of [p, ...($('lm_movePartner').checked ? partnersOf(p) : [])]) {
      res = await saveException(r, { type: 'Move', new_day: ch.day, new_time: ch.time, new_coach: ch.coach, notes: ch.notes });
      if (res.error) break;
    }
    if ((!res || !res.error) && (ch.notes !== (p.notes || null) || other))
      res = await sb.from('private_lessons').update({ notes: ch.notes, duration: ch.duration, lesson_type: ch.lesson_type }).eq('id', p.id);
  }
  $('lm_save').disabled = false;
  if (!res) return closeLesson();
  if (res.error) return lmMsg(res.error.message, true);
  closeLesson(); loadWeek();
}

async function cancelLesson() {
  const p = lmRow; if (!p) return;
  const exId = addExId(p.id), perm = !exId && $('lm_scope').value === 'permanent';
  if (exId) { if (!confirm('Cancel ' + p.student_name + '?\n\nThis was a one-week spot. The slot opens back up and the family stays on the waitlist.')) return; }
  else if (perm) { if (!confirm('Permanently remove ' + p.student_name + ' from the week of ' + mondayOf($('lm_start').value || weekStartStr()) + ' forward?\n\nEarlier weeks are left alone.')) return; }
  else if (!confirm('Cancel lesson for ' + p.student_name + ' for this week only?')) return;
  lmMsg('Cancelling…');
  let res;
  if (exId) {
    res = await sb.from('schedule_exceptions').update({ status: 'Deleted' }).eq('id', exId);
    if (!res.error && p.student_id) await sb.from('waitlist').update({ status: 'Drop-In' }).eq('student_id', p.student_id).eq('status', 'Claimed');
  } else if (perm) res = await sb.from('private_lessons').update({ end_date: mondayOf($('lm_start').value || weekStartStr()) }).eq('id', p.id);
  else res = await saveException(p, { type: 'Cancel', notes: 'Cancelled from schedule' });
  if (res.error) return lmMsg(res.error.message, true);
  closeLesson(); loadWeek();
}

// ================= ADD LESSON (port of 2.0 openAddLessonForSlot_ / addLessonForStudent) =================
const PRICING = { Solo: { '30 min': '$40', '45 min': '$60', '60 min': '$80' }, Shared: { '30 min': '$30', '45 min': '$45', '60 min': '$60' } };
const priceFor = (dur, type) => (PRICING[type] || PRICING.Solo)[dur] || (PRICING[type] || PRICING.Solo)['30 min'];
let alPick = { student: null, partner: null };
function alMsg(t, err) { $('al_msg').className = 'msg' + (err ? ' err' : ''); $('al_msg').textContent = t; }
function closeAdd() { $('addModal').classList.add('hidden'); }
function openAdd(day, time, coach) {
  const coaches = [...new Set(weekRows.map(r => r.coach).concat(weekSlots.map(s => s.coach)).filter(Boolean))].sort();
  alPick = { student: null, partner: null };
  $('al_student').value = ''; $('al_partner').value = ''; $('al_focus').value = '';
  $('al_coach').innerHTML = opts(coaches.concat('TBD'), coach || coaches[0] || 'TBD');
  $('al_day').innerHTML = opts(DAYS, day || 'Monday');
  $('al_time').innerHTML = opts(TIMES, time || '4:00 PM');
  $('al_duration').value = '30 min';
  $('al_scope').value = 'permanent'; $('al_startWrap').classList.remove('hidden'); $('al_start').value = weekStartStr();
  alPrice(); alMsg('');
  $('addModal').classList.remove('hidden'); $('al_student').focus();
}
function alDD(which) {
  const q = $('al_' + which).value.trim().toLowerCase(), other = alPick[which === 'student' ? 'partner' : 'student'];
  alPick[which] = null; alPrice();
  const list = students.filter(s => isOn(s) && (!other || s.id !== other.id) && (!q || (s.first_name + ' ' + s.last_name).toLowerCase().includes(q))).slice(0, 30);
  const dd = $('al_' + which + 'DD');
  dd.innerHTML = list.map(s => `<div onmousedown="alSet('${which}','${esc(s.id)}')">${esc(s.first_name)} ${esc(s.last_name)} <small>${esc(s.status || '')}${s.skill_level ? ' · ' + esc(s.skill_level) : ''}</small></div>`).join('') || '<div><small>No match</small></div>';
  dd.classList.remove('hidden');
}
function alSet(which, id) {
  const s = students.find(x => x.id === id); alPick[which] = s;
  $('al_' + which).value = s.first_name + ' ' + s.last_name; $('al_' + which + 'DD').classList.add('hidden');
  if (which === 'student' && s.skill_level && !$('al_focus').value) $('al_focus').value = s.skill_level;
  alPrice();
}
function alPrice() {
  const dur = $('al_duration').value, shared = !!alPick.partner;
  $('al_price').textContent = (shared ? 'Shared — ' + priceFor(dur, 'Shared') + '/wk each' : 'Solo — ' + priceFor(dur, 'Solo') + '/wk') + ' (' + dur + ')';
}
async function saveAdd() {
  const st = alPick.student, pt = alPick.partner;
  if (!st) return alMsg('Pick a student from the list.', true);
  if ($('al_partner').value.trim() && !pt) return alMsg('Pick the partner from the list (or clear it).', true);
  const day = $('al_day').value, time = $('al_time').value, coach = $('al_coach').value, dur = $('al_duration').value;
  const type = pt ? 'Shared' : 'Solo', kids = pt ? [st, pt] : [st], name = s => s.first_name + ' ' + s.last_name;
  $('al_save').disabled = true; alMsg('Saving…');
  let res;
  if ($('al_scope').value === 'week') {
    // One-week lesson = Add exception (shows as "This week")
    res = await sb.from('schedule_exceptions').insert(kids.map(k => ({ gym_id: gymId, lesson_id: 'BASE_' + k.id + '_' + day, student_id: k.id, student_name: name(k),
      coach, base_day: '', base_time: '', week_start: weekStartStr(), original_date: dateFor(day), type: 'Add', new_day: day, new_time: time, new_coach: coach,
      status: 'Active', notes: $('al_focus').value.trim() || null, lesson_type: type, created_at: new Date().toISOString() })));
  } else {
    const start = mondayOf($('al_start').value || weekStartStr()), pairId = pt ? 'PAIR' + Date.now() : null;
    res = await sb.from('private_lessons').insert(kids.map(k => ({ gym_id: gymId, student_id: k.id, student_name: name(k), coach, day, time, duration: dur,
      focus: $('al_focus').value.trim() || k.skill_level || null, price: priceFor(dur, type), status: 'Confirmed', booked_date: ymd(new Date()), paid: 'Unpaid',
      lesson_type: type, share_type: pt ? 'Matched' : 'No', pair_id: pairId, matched_with: pt ? name(k === st ? pt : st) : null, friend_name: pt ? name(k === st ? pt : st) : null,
      start_date: start })));
    // Same as 2.0: a permanent lesson makes a Waitlist/Drop-In/Inactive student Active (waitlist row left alone)
    const flip = kids.filter(k => ['Waitlist','Drop-In','Inactive'].includes(k.status)).map(k => k.id);
    if (!res.error && flip.length) { await sb.from('students').update({ status: 'Active', active: true }).in('id', flip); flip.forEach(id => students.find(s => s.id === id).status = 'Active'); }
  }
  $('al_save').disabled = false;
  if (res.error) return alMsg(res.error.message, true);
  closeAdd(); loadWeek();
}

// Tap an "Away" row → undo this week's cancel/move
async function restoreLesson(id) {
  const p = weekRows.find(r => r.id === id), ex = weekEx.find(e => e.lesson_id === id && e.type !== 'Add');
  if (!p || !ex) return;
  if (!confirm('Put ' + p.student_name + ' back on ' + p.bday + ' ' + p.btime + ' this week?')) return;
  const res = await sb.from('schedule_exceptions').update({ status: 'Deleted' }).eq('id', ex.id);
  if (res.error) return alert(res.error.message);
  loadWeek();
}

boot();
</script>
